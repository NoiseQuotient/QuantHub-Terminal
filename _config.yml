# Jekyll configuration for Quant Frontier
title: "Quant Frontier"
description: "AI‑curated frontier of quantitative finance research — live papers, code, and insights, summarized and ranked."
baseurl: ""
url: "https://noisequotient.github.io/QuantHub-Terminal"
github_username: noisequotient

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Data source
data_dir: "_data"

# Customization
header_pages:
  - index.md
  - about.md

# Exclude from processing
exclude:
  - .github/
  - fetch_quant.py
  - requirements.txt
  - README.md
  - venv/
  - .gitignore