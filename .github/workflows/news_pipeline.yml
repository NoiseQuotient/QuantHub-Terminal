name: Quant Frontier News Pipeline

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [ main ]
    paths:
      - 'news_pipeline.py'
      - '.github/workflows/news_pipeline.yml'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser beautifulsoup4 requests
        
    - name: Run News Pipeline
      run: |
        python news_pipeline.py
        
    - name: Commit pipeline results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Check if database changed
        if git diff --name-only | grep -q "news_pipeline.db"; then
          git add news_pipeline.db
          git commit -m "Update: News pipeline database with latest articles"
          git push
        else
          echo "No changes to database"
        fi
        
    - name: Generate pipeline report
      run: |
        echo "📊 Pipeline Report" > pipeline_report.md
        echo "==================" >> pipeline_report.md
        echo "" >> pipeline_report.md
        echo "Run: $(date)" >> pipeline_report.md
        echo "" >> pipeline_report.md
        
        # Get pipeline stats
        python -c "
import sqlite3
import json
conn = sqlite3.connect('news_pipeline.db')
cursor = conn.cursor()

# Total articles
cursor.execute('SELECT COUNT(*) FROM articles')
total = cursor.fetchone()[0]

# Relevant articles
cursor.execute('SELECT COUNT(*) FROM articles WHERE relevance_score >= 2.0')
relevant = cursor.fetchone()[0]

# Recent articles
cursor.execute('''
    SELECT source, title, relevance_score, quant_category 
    FROM articles 
    WHERE relevance_score >= 2.0 
    ORDER BY publish_date DESC 
    LIMIT 5
''')
recent = cursor.fetchall()

print(f'Total articles: {total}')
print(f'Relevant articles: {relevant}')
print('')
print('Top recent articles:')
for article in recent:
    print(f'- [{article[0]}] {article[1]}')
    print(f'  Score: {article[2]:.1f} | Category: {article[3]}')
    print('')

conn.close()
" >> pipeline_report.md
        
    - name: Upload pipeline report
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-report
        path: pipeline_report.md