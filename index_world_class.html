<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant Frontier | World‑Class Quantitative Finance Intelligence</title>
    <style>
        :root {
            --color-bg: #0a0a0f;
            --color-surface: #11111f;
            --color-surface-elevated: #1a1a2f;
            --color-primary: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
            --color-text: #f8fafc;
            --color-text-secondary: #94a3b8;
            --color-border: #2d3748;
            --font-mono: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            --font-serif: 'Charter', 'Georgia', 'Times New Roman', serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-bg); 
            color: var(--color-text); 
            line-height: 1.7;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .container { 
            max-width: 1600px; 
            margin: 0 auto; 
            padding: 0 2rem; 
        }
        
        /* HEADER - Institutional Grade */
        .header { 
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            color: white; 
            padding: 3rem 0 2rem;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .header-content {
            position: relative;
            z-index: 1;
        }
        
        .header h1 { 
            font-size: 3rem; 
            font-weight: 800;
            margin-bottom: 0.5rem; 
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header-subtitle {
            font-size: 1.25rem;
            color: #cbd5e1;
            margin-bottom: 1.5rem;
            max-width: 800px;
            line-height: 1.6;
        }
        
        .header-stats {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat {
            display: flex;
            flex-direction: column;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--color-primary);
            font-family: var(--font-mono);
        }
        
        .stat-label {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        /* NAVIGATION - Professional Trading Desk Style */
        .nav {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0;
        }
        
        .nav-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .nav-filter {
            padding: 0.625rem 1.25rem;
            background: var(--color-surface-elevated);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            color: var(--color-text-secondary);
            font-family: var(--font-mono);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .nav-filter:hover {
            border-color: var(--color-primary);
            color: var(--color-text);
        }
        
        .nav-filter.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
            font-weight: 600;
        }
        
        .nav-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .control-label {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            font-family: var(--font-mono);
        }
        
        .control-slider {
            width: 150px;
            height: 4px;
            -webkit-appearance: none;
            background: var(--color-border);
            border-radius: 2px;
            outline: none;
        }
        
        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--color-primary);
            cursor: pointer;
            border: 2px solid var(--color-bg);
        }
        
        /* MAIN CONTENT - Research Terminal Layout */
        .main {
            padding: 3rem 0;
            min-height: 100vh;
        }
        
        .research-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }
        
        /* RESEARCH CARD - Institutional Research Note Style */
        .research-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .research-card:hover {
            transform: translateY(-2px);
            border-color: var(--color-primary);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .research-card.priority {
            border-left: 4px solid var(--color-success);
        }
        
        .research-card.breaking {
            border-left: 4px solid var(--color-danger);
        }
        
        .research-header {
            padding: 1.5rem 1.5rem 1rem;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .research-meta {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        
        .research-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: var(--font-mono);
        }
        
        .badge-source {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        
        .badge-priority {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .badge-breaking {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .research-relevance {
            font-family: var(--font-mono);
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }
        
        .relevance-score {
            font-weight: 700;
            color: var(--color-success);
        }
        
        .research-content {
            padding: 1.5rem;
        }
        
        .research-title {
            font-size: 1.375rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 1rem;
            color: var(--color-text);
        }
        
        .research-title a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .research-title a:hover {
            color: var(--color-primary);
        }
        
        .research-abstract {
            color: var(--color-text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.7;
            font-size: 1rem;
        }
        
        .research-metrics {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--color-surface-elevated);
            border-radius: 8px;
            border: 1px solid var(--color-border);
        }
        
        .metric {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        
        .metric-value {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-text);
        }
        
        .metric-label {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }
        
        .research-details {
            margin-bottom: 1.5rem;
        }
        
        .detail-section {
            margin-bottom: 1rem;
        }
        
        .detail-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            font-family: var(--font-mono);
        }
        
        .detail-content {
            color: var(--color-text-secondary);
            font-size: 0.9375rem;
            line-height: 1.6;
        }
        
        .math-notation {
            font-family: var(--font-serif);
            font-style: italic;
            color: #c4b5fd;
        }
        
        .research-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-surface-elevated);
        }
        
        .research-actions {
            display: flex;
            gap: 0.75rem;
        }
        
        .action-btn {
            padding: 0.5rem 1rem;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            color: var(--color-text);
            font-family: var(--font-mono);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .action-btn:hover {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }
        
        .action-btn.primary {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
            font-weight: 600;
        }
        
        .action-btn.primary:hover {
            background: var(--color-primary-dark);
        }
        
        .research-authors {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }
        
        /* FOOTER - Professional */
        .footer {
            background: var(--color-surface);
            border-top: 1px solid var(--color-border);
            padding: 3rem 0;
            margin-top: 4rem;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .footer-info {
            color: var(--color-text-secondary);
            font-size: 0.875rem;
        }
        
        .footer-links {
            display: flex;
            gap: 1.5rem;
        }
        
        .footer-link {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s ease;
        }
        
        .footer-link:hover {
            color: var(--color-primary);
        }
        
        /* UTILITY CLASSES */
        .text-success { color: var(--color-success); }
        .text-warning { color: var(--color-warning); }
        .text-danger { color: var(--color-danger); }
        
        .font-mono { font-family: var(--font-mono); }
        .font-serif { font-family: var(--font-serif); }
        
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        
        .font-bold { font-weight: 700; }
        .font-extrabold { font-weight: 800; }
        
        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .research-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 0 1.5rem;
            }
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.25rem;
            }
            
            .header-stats {
                flex-direction: column;
                gap: 1rem;
            }
            
            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }
            
            .nav-filters {
                justify-content: center;
            }
            
            .research-footer {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
            
            .research-actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER - Institutional Grade -->
    <header class="header">
        <div class="container header-content">
            <h1>Quant Frontier</h1>
            <p class="header-subtitle">
                World‑class quantitative finance intelligence platform. 
                Curated for the world's leading hedge funds, research institutions, and trading desks.
            </p>
            
            <div class="header-stats">
                <div class="stat">
                    <span class="stat-value">24</span>
                    <span class="stat-label">Active Research Notes</span>
                </div>
                <div class="stat">
                    <span class="stat-value">98.7%</span>
                    <span class="stat-label">Avg. Relevance Score</span>
                </div>
                <div class="stat">
                    <span class="stat-value">9.8</span>
                    <span class="stat-label">Avg. Quality Rating</span>
                </div>
                <div class="stat">
                    <span class="stat-value">2.4m</span>
                    <span
